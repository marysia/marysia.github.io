---
layout: default
---
<article class="til-single">
  <header class="til-header">
    <p class="til-meta-line">
      {% if page.series %}
        <span class="til-series">{{ page.series | escape }}</span>
      {% endif %}
      <span class="til-meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">
          {%- assign date_format = site.minima.date_format | default: "%-d %B %Y" -%}
          {{ page.date | date: date_format }}
        </time>
      </span>
    </p>
    <h1 class="til-title">{{ page.title | escape }}</h1>
  </header>
  <div class="til-content">
    {{ content }}
  </div>
</article>
