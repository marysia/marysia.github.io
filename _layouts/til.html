---
layout: default
---
<article class="til-single">
  <header class="til-single-header">
    {%- if page.tag -%}<p class="til-single-kicker">{{ page.tag | escape }}</p>{%- endif -%}
    <h1 class="til-single-title">{{ page.title | escape }}</h1>
    <p class="til-single-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %b %Y" }}</time>
    </p>
  </header>
  <div class="til-single-content">
    {{ content }}
  </div>
</article>
