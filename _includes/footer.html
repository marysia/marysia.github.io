<footer class="site-foot">
  <div class="wrap">
    <span class="fn">{{ site.author | escape }} · <a href="mailto:{{ site.email }}">{{ site.email }}</a></span>
    <span class="tag-line">
      {%- if page.footer_tagline -%}
        {{ page.footer_tagline | markdownify }}
      {%- else -%}
        A space for keeping track of what I learn.
      {%- endif -%}
    </span>
  </div>
</footer>
