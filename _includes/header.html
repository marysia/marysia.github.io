<header class="site-head" role="banner">
  <div class="wrap">
    <div class="brand"><a href="{{ "/" | relative_url }}">Marysia Winkels<span class="dot">.</span></a></div>
    <nav class="main" aria-label="Main">
      {%- assign home_active = false -%}
      {%- if page.url == "/" or page.url == "/index.html" -%}
        {%- assign home_active = true -%}
      {%- endif -%}
      <a href="{{ "/" | relative_url }}"{% if home_active %} class="active"{% endif %}>Home</a>
      <a href="{{ "/notes/" | relative_url }}"{% if page.url contains "/notes" %} class="active"{% endif %}>Notes</a>
      <a href="{{ "/til/" | relative_url }}"{% if page.url contains "/til" %} class="active"{% endif %}>TIL</a>
      <a href="{{ "/talks/" | relative_url }}"{% if page.url contains "/talks" %} class="active"{% endif %}>Talks</a>
      <a href="{{ "/cv/" | relative_url }}"{% if page.url contains "/cv" %} class="active"{% endif %}>CV</a>
    </nav>
  </div>
</header>
